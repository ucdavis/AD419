parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()

  - name: variableGroup
    type: string
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    variables:
      # Create this variable group in Azure DevOps with environment-specific values:
      # - RESOURCE_GROUP, LOCATION, APP_NAME, ENVIRONMENT, DEPLOYMENT_NAME
      # - SQL_ADMIN_LOGIN, SQL_ADMIN_PASSWORD (secret)
      # - Optional app settings documented in infrastructure/azure/README.md
      - group: ${{ parameters.variableGroup }}
    jobs:
      - deployment: deploy
        displayName: Deploy to ${{ parameters.environmentName }}
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  displayName: Checkout repo

                - download: current
                  artifact: packages

                - task: AzureCLI@2
                  displayName: (optional) Deploy infra (Bicep)
                  condition: and(succeeded(), eq(variables['deployInfra'], 'true'))
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      cd "$(Build.SourcesDirectory)"
                      env \
                        RESOURCE_GROUP="$(RESOURCE_GROUP)" \
                        LOCATION="$(LOCATION)" \
                        APP_NAME="$(APP_NAME)" \
                        ENVIRONMENT="$(ENVIRONMENT)" \
                        DEPLOYMENT_NAME="$(DEPLOYMENT_NAME)" \
                        SQL_ADMIN_LOGIN="$(SQL_ADMIN_LOGIN)" \
                        SQL_ADMIN_PASSWORD="$(SQL_ADMIN_PASSWORD)" \
                        NOTIFICATION_BASE_URL="${NOTIFICATION_BASE_URL:-}" \
                        bash infrastructure/azure/scripts/deploy.sh
                  env:
                    NOTIFICATION_BASE_URL: $(Notification__BaseUrl)

                - task: AzureCLI@2
                  name: resolveNames
                  displayName: Resolve app name from infra outputs
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      webAppName=$(az deployment group show \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --name "$(DEPLOYMENT_NAME)" \
                        --query "properties.outputs.webAppName.value" -o tsv)

                      echo "Resolved web app: $webAppName"
                      echo "##vso[task.setvariable variable=webAppName]$webAppName"

                - task: AzureCLI@2
                  displayName: Set Web App runtime settings
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      settings=(
                        "ASPNETCORE_ENVIRONMENT=$ENVIRONMENT_NAME"
                        "OTEL_SERVICE_NAME=ad419.web"
                        "OTEL_RESOURCE_ATTRIBUTES=service.name=ad419.web,service.environment=$ENVIRONMENT_NAME,deployment.environment.name=$ENVIRONMENT_NAME"
                      )

                      append_setting() {
                        local name="$1"
                        local value="${2:-}"

                        if [[ -z "$value" || "$value" == \$\(* ]]; then
                          return
                        fi

                        settings+=("$name=$value")
                      }

                      append_setting "Notification__BaseUrl" "$NOTIFICATION_BASE_URL"
                      append_setting "Smtp__Host" "$SMTP_HOST"
                      append_setting "Smtp__Port" "$SMTP_PORT"
                      append_setting "Smtp__Timeout" "$SMTP_TIMEOUT"
                      append_setting "Smtp__UseSsl" "$SMTP_USE_SSL"
                      append_setting "Smtp__Username" "$SMTP_USERNAME"
                      append_setting "Smtp__Password" "$SMTP_PASSWORD"
                      append_setting "Smtp__FromEmail" "$SMTP_FROM_EMAIL"
                      append_setting "Smtp__FromName" "$SMTP_FROM_NAME"
                      append_setting "Smtp__ReplyToEmail" "$SMTP_REPLY_TO_EMAIL"
                      append_setting "Smtp__BccEmail" "$SMTP_BCC_EMAIL"
                      append_setting "OTEL_EXPORTER_OTLP_ENDPOINT" "$OTEL_EXPORTER_OTLP_ENDPOINT_VALUE"
                      append_setting "OTEL_EXPORTER_OTLP_HEADERS" "$OTEL_EXPORTER_OTLP_HEADERS_VALUE"
                      append_setting "OTEL_EXPORTER_OTLP_PROTOCOL" "$OTEL_EXPORTER_OTLP_PROTOCOL_VALUE"

                      az webapp config appsettings set \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --name "$(webAppName)" \
                        --settings "${settings[@]}" \
                        --output none
                  env:
                    ENVIRONMENT_NAME: $(ENVIRONMENT)
                    NOTIFICATION_BASE_URL: $(Notification__BaseUrl)
                    SMTP_HOST: $(Smtp__Host)
                    SMTP_PORT: $(Smtp__Port)
                    SMTP_TIMEOUT: $(Smtp__Timeout)
                    SMTP_USE_SSL: $(Smtp__UseSsl)
                    SMTP_USERNAME: $(Smtp__Username)
                    SMTP_PASSWORD: $(Smtp__Password)
                    SMTP_FROM_EMAIL: $(Smtp__FromEmail)
                    SMTP_FROM_NAME: $(Smtp__FromName)
                    SMTP_REPLY_TO_EMAIL: $(Smtp__ReplyToEmail)
                    SMTP_BCC_EMAIL: $(Smtp__BccEmail)
                    OTEL_EXPORTER_OTLP_ENDPOINT_VALUE: $(OTEL_EXPORTER_OTLP_ENDPOINT)
                    OTEL_EXPORTER_OTLP_HEADERS_VALUE: $(OTEL_EXPORTER_OTLP_HEADERS)
                    OTEL_EXPORTER_OTLP_PROTOCOL_VALUE: $(OTEL_EXPORTER_OTLP_PROTOCOL)

                - task: AzureWebApp@1
                  displayName: Deploy web app
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/packages/webapp.zip
